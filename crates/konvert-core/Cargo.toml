[package]
name = "konvert-core"
description = "Konvert domain logic: format catalog, FFmpeg command builder, media probing and process runner"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["process", "io-util", "rt", "sync", "time", "macros"] }
tokio-util = { workspace = true }
# Generates TypeScript bindings (src/bindings) from the domain types during `cargo test`.
ts-rs = { workspace = true }
# SVG pictures are rendered by Konvert (FFmpeg's librsvg is not in every build).
resvg = { workspace = true }
# PDF documents: pages rendered by hayro, files read and written by lopdf.
hayro = { workspace = true }
lopdf = { workspace = true }
# Smaller PDFs: pictures stored again as JPEG, streams recompressed.
jpeg-encoder = { workspace = true }
flate2 = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
