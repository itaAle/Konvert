[workspace]
resolver = "3"
members = ["crates/konvert-core", "crates/konvert-cli", "src-tauri"]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "MIT"
# Typst (DOCX to PDF) needs 1.92.
rust-version = "1.92"
repository = "https://github.com/itaAle/Konvert"

[workspace.dependencies]
konvert-core = { path = "crates/konvert-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", default-features = false }
tokio-util = { version = "0.7", default-features = false }
ts-rs = { version = "12", default-features = false, features = ["serde-compat", "no-serde-warnings"] }
windows-sys = "0.61"
# SVG rendering (pure Rust, Apache-2.0 OR MIT, no network code).
resvg = "0.49"
# PDF rendering (pure Rust, Apache-2.0 OR MIT, no unsafe code, no network code).
hayro = "0.8"
# PDF reading, merging and writing (pure Rust, MIT).
lopdf = { version = "0.46", default-features = false }
# Smaller PDFs: pictures stored again as JPEG (pure Rust, MIT OR Apache-2.0, IJG), streams
# recompressed with Deflate (already used by lopdf; pure Rust backend, MIT OR Apache-2.0).
jpeg-encoder = "0.7"
flate2 = "1"
# Word documents (DOCX): read and written as ZIP archives of XML parts (MIT; Deflate only,
# through flate2), parsed with roxmltree (MIT OR Apache-2.0, already used by the SVG renderer).
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
roxmltree = "0.21"
# Pictures inside Word documents, decoded to be stored smaller (MIT OR Apache-2.0).
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# DOCX to PDF: the Typst typesetting engine as a library (Apache-2.0, pure Rust). Only its
# system font discovery is used from typst-kit: no package or file downloads.
typst = "0.15"
typst-layout = "0.15"
typst-pdf = "0.15"
typst-kit = { version = "0.15", default-features = false, features = ["scan-fonts"] }

# Release profile shared by every crate of the workspace (Tauri reads it from the root).
# See https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
