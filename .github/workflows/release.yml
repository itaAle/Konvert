# Builds the macOS and Linux packages of a release with scripts/build-release.sh.
# Run it by hand. It only produces workflow artifacts (packages + .sha256): the
# owner downloads them, checks them and attaches them to the GitHub release.
# The Windows installer is built locally with `npm run release`.
# The "platform" input packages a single platform, e.g. to redo one that failed.
#
# macOS: without secrets the app is signed ad hoc and not notarized (no Apple
# Developer account needed; users allow it once in Gatekeeper, see README.md).
# For a Developer ID signature and notarization, add these repository secrets:
#   APPLE_CERTIFICATE           Developer ID Application certificate (.p12), base64
#   APPLE_CERTIFICATE_PASSWORD  password of the .p12
#   APPLE_SIGNING_IDENTITY      "Developer ID Application: Name (TEAMID)"
#   APPLE_ID                    Apple Account e-mail used for notarization
#   APPLE_PASSWORD              app-specific password of that account
#   APPLE_TEAM_ID               Team ID
name: Release packages

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to package (all, or a single one to redo it)
        type: choice
        default: all
        options: [all, macos-arm64, linux-x64, linux-arm64]

permissions:
  contents: read

jobs:
  select:
    name: Select platforms
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - id: select
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          all='[
            {"key":"macos-arm64","name":"macOS arm64","os":"macos-15"},
            {"key":"linux-x64","name":"Linux x64","os":"ubuntu-22.04"},
            {"key":"linux-arm64","name":"Linux arm64","os":"ubuntu-22.04-arm"}
          ]'
          matrix="$(jq -c --arg p "$PLATFORM" 'map(select($p == "all" or .key == $p))' <<<"$all")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  package:
    name: Package (${{ matrix.name }})
    needs: select
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          require-pinned-ffmpeg: "true"

      - name: Import the signing certificate (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [[ -z "$APPLE_CERTIFICATE" ]]; then
            echo "::warning::No APPLE_* secrets: the app is signed ad hoc and not notarized."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"

      - name: Build, check and package
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/build-release.sh

      - name: No network activity (Linux)
        if: runner.os == 'Linux'
        run: |
          src-tauri/binaries/ffmpeg/ffmpeg -hide_banner -loglevel error -f lavfi -i sine=d=3 "$RUNNER_TEMP/test.wav"
          xvfb-run -a bash scripts/monitor-network.sh --seconds 30 target/release/konvert "$RUNNER_TEMP/test.wav"

      - name: No network activity (macOS)
        if: runner.os == 'macOS'
        run: |
          src-tauri/binaries/ffmpeg/ffmpeg -hide_banner -loglevel error -f lavfi -i sine=d=3 "$RUNNER_TEMP/test.wav"
          # The signed app as shipped (its main executable is the only file in Contents/MacOS).
          app_exe="$(find target/release/bundle/macos/Konvert.app/Contents/MacOS -maxdepth 1 -type f | head -n1)"
          bash scripts/monitor-network.sh --seconds 30 "$app_exe" "$RUNNER_TEMP/test.wav"

      # One artifact (one zip) per package, with its .sha256: users download only
      # what their system needs.
      - name: Package names
        id: files
        run: |
          for ext in dmg deb rpm AppImage; do
            file="$(cd release && ls -- *."$ext" 2>/dev/null | head -n1 || true)"
            echo "$ext=$file" >> "$GITHUB_OUTPUT"
          done

      - if: steps.files.outputs.dmg != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.files.outputs.dmg }}
          path: release/${{ steps.files.outputs.dmg }}*
          if-no-files-found: error

      - if: steps.files.outputs.deb != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.files.outputs.deb }}
          path: release/${{ steps.files.outputs.deb }}*
          if-no-files-found: error

      - if: steps.files.outputs.rpm != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.files.outputs.rpm }}
          path: release/${{ steps.files.outputs.rpm }}*
          if-no-files-found: error

      - if: steps.files.outputs.AppImage != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.files.outputs.AppImage }}
          path: release/${{ steps.files.outputs.AppImage }}*
          if-no-files-found: error
