# Shared setup of the CI and release workflows: Node, Rust cache, system libraries
# (Linux), npm packages, the pinned FFmpeg build and the OCR models.
name: Set up the Konvert build
description: Node, npm packages, system libraries, the pinned FFmpeg build and the OCR models

inputs:
  require-pinned-ffmpeg:
    description: >
      "true" (release): fail when the macOS FFmpeg build is not pinned in the manifest.
      "false" (CI): build it from source with scripts/build-ffmpeg-macos.sh instead.
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22
        cache: npm

    - name: System libraries (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev \
          patchelf file libfuse2 rpm strace xvfb xdg-utils

    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

    - name: npm packages
      shell: bash
      run: npm ci --no-audit --no-fund

    - name: Is the macOS FFmpeg build pinned?
      id: mac
      if: runner.os == 'macOS'
      shell: bash
      run: |
        sha="$(node -p 'require("./scripts/ffmpeg-manifest.json").platforms["macos-aarch64"].sha256')"
        if [[ -n "$sha" ]]; then echo "pinned=true" >> "$GITHUB_OUTPUT"; exit 0; fi
        echo "pinned=false" >> "$GITHUB_OUTPUT"
        if [[ "${{ inputs.require-pinned-ffmpeg }}" == "true" ]]; then
          echo "::error::Pin the macOS FFmpeg build in scripts/ffmpeg-manifest.json before a release."
          exit 1
        fi

    - name: Cached macOS FFmpeg build
      if: steps.mac.outputs.pinned == 'false'
      id: mac-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .ffmpeg-build/out
        key: ffmpeg-macos-${{ hashFiles('scripts/build-ffmpeg-macos.sh') }}

    - name: Build FFmpeg for macOS (not pinned yet)
      if: steps.mac.outputs.pinned == 'false' && steps.mac-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        brew install nasm cmake meson ninja pkg-config autoconf automake libtool subversion
        bash scripts/build-ffmpeg-macos.sh

    - name: FFmpeg
      shell: bash
      run: |
        if [[ "${{ steps.mac.outputs.pinned }}" == "false" ]]; then
          dest=src-tauri/binaries/ffmpeg
          rm -rf "$dest" "$RUNNER_TEMP/ffmpeg" && mkdir -p "$dest" "$RUNNER_TEMP/ffmpeg"
          tar -xJf .ffmpeg-build/out/ffmpeg-*-macos-arm64-lgpl.tar.xz -C "$RUNNER_TEMP/ffmpeg"
          cp "$RUNNER_TEMP"/ffmpeg/*/bin/* "$RUNNER_TEMP"/ffmpeg/*/LICENSE.txt "$dest/"
          "$dest/ffmpeg" -hide_banner -version | head -n1
        else
          npm run setup:ffmpeg
        fi

    - name: OCR models
      shell: bash
      run: npm run setup:ocr
